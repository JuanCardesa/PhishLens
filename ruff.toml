# Lint with the default rule set of the Ruff release pinned in
# backend/requirements-dev.txt (0.16.x). Ruff changes its defaults between minor
# releases (0.16 enabled import sorting, SIM, BLE, UP, TRY, and more), so the
# version is pinned there instead of floating: upgrading Ruff to a new minor is a
# deliberate change that fixes the new findings in the same commit.
target-version = "py311"

[lint]
# 0.16's defaults keep only two pycodestyle "E" rules. Keep every E4/E7/E9 rule
# the project was linted with before (imports not at top, bare except, comparisons
# to None, ...) so adopting the new defaults adds checks and removes none.
extend-select = ["E4", "E7", "E9"]
